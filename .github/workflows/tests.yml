name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/wx-video-account-notes/skills/wx-video-account-notes
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.25
      - run: uv python install 3.13.14
      - run: uv sync --locked --python 3.13.14
      - run: uv run --locked python -m unittest discover -s runtime/tests
      - if: runner.os == 'Linux'
        run: uv run --locked python -m unittest discover -s ../../../../server -p 'test_*.py'

  browser-smoke:
    runs-on: ubuntu-24.04
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.runtime/server/.venv
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.runtime/server/browsers
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.25
      - run: uv sync --locked --project server --python 3.13.14
      - run: uv run --locked --project server python -m playwright install --with-deps --no-shell chromium
      - run: uv run --locked --project server python server/smoke_browser.py
